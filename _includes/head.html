<meta charset="utf-8">

{% include seo.html %}
{% include head/zotero.html %}
{% if page.collection == "posts" %}
<link rel="cite-as" href="{{ page.canonical_url | default: page.url | absolute_url }}">
<link rel="type" href="https://schema.org/BlogPosting">
<link rel="author" href="{{ site.author.url | default: site.url }}">
<link rel="describedby" type="application/ld+json" profile="https://schema.org/" href="{{ page.url | append: 'metadata.json' | relative_url }}">
{% else %}
<link rel="describedby" type="application/ld+json" profile="https://schema.org/" href="{{ '/metadata.json' | relative_url }}">
{% endif %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!--[if IE]>
  <style>
    /* old IE unsupported flexbox fixes */
    .greedy-nav .site-title {
      padding-right: 3em;
    }
    .greedy-nav button {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
    }
  </style>
<![endif]-->

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
